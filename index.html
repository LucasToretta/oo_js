    <!DOCTYPE html>
    <html lang="pt-BR">
    <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="main.css">
    <title>Encomenda para doces</title>
    </head>
    <body>
    <div class="container py-5">
        <h1 class="mb-4 text-center">Encomenda de Bolos</h1>
        
        <form id="formPedido" class="card p-4 shadow rounded-3">

            <div class="mb-3">
            <label for="massa" class="form-label">Massa:</label>
            <select id="massa" class="form-select">
            <option>Chocolate</option>
            <option>Branca</option>
            <option>Red Velvet</option>
            </select>

        <div class="mb-3 mt-3">
            <label for="molhadoCom" class="form-label">Molhado com:</label>
            <select id="molhadoCom" class="form-select">
            <option>Leite</option>
            <option>Calda</option>
            <option>Guaraná</option>
            </select>

        <div class="mb-3 mt-3">
            <label for="recheio" class="form-label">Recheio:</label>
            <select id="recheio" class="form-select">
            <option>Brigadeiro</option>
            <option>Trufa</option>
            <option>Creme</option>
            </select>
        </div>

        <div class="mb-3 mt-3">
            <label for="cobertura" class="form-label">Cobertura:</label>
            <select id="cobertura" class="form-select">
            <option>Chantilly</option>
            <option>Buttercream</option>
            <option>Ganache</option>
            </select>
        </div>

        <div class="mb-3 mt-3">
            <label for="tipoBolo" class="form-label">Tipo de Bolo:</label>
            <select id="tipoBolo" class="form-select">
            <option value="casamento">Bolo de Casamento</option>
            <option value="aniversario">Bolo de Aniversário</option>
            </select>
        </div>

        <div class="mb-4">
            <label for="tamanho" class="form-label">Tamanho do bolo:</label>
            <select id="tamanho" class="form-select">
            <option>1 kg</option>
            <option>2 kg</option>
            <option>3 kg</option>
            <option>4 kg</option>
            <option>5 kg</option>
            </select>
        </div>

        <div class="mb-3 mt-3">
            <label for="nomeCliente" class="form-label">Nome do cliente:</label>
            <input type="text" class="form-control" id="nomeCliente" required>
        </div>


        <button type="submit" class="btn btn-primary w-100">Fazer Pedido</button>
        </form>

        <div id="pedidos" class="mt-5"></div>
    </div>

    <script src="main.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    </body>
    </html>
